name: 小黑盒签到
on:
  workflow_dispatch:
  schedule:
    # UTC 01:03 / 13:03 = Beijing 09:03 / 21:03
    - cron: '3 1,13 * * *'
permissions:
  contents: read
concurrency:
  group: xiaoheihe-sign
  cancel-in-progress: false
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check '小黑盒签到.js'
      - name: Check account configuration
        env:
          BLACKBOX_COOKIE: ${{ secrets.BLACKBOX_COOKIE }}
        run: |
          if [ -z "$BLACKBOX_COOKIE" ]; then
            echo 'Please configure repository secret BLACKBOX_COOKIE first.'
            exit 1
          fi
      - name: Install dependency
        run: npm install --no-audit --no-fund --package-lock=false axios
      - name: Run sign-in
        env:
          BLACKBOX_COOKIE: ${{ secrets.BLACKBOX_COOKIE }}
        run: node '小黑盒签到.js'
